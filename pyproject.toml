[project]
name = "acmed-plugin-sdk"
version = "0.2.0"
description = "Shared issuer plugin contract and HTTP+JSON scaffolding for acmed gen2"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "ACMed Contributors"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/rohzb/acmed-plugin-sdk"
Repository = "https://github.com/rohzb/acmed-plugin-sdk"
Issues = "https://github.com/rohzb/acmed-plugin-sdk/issues"

[project.optional-dependencies]
server = ["uvicorn>=0.30.0"]
dev = [
  "pytest>=8.0.0",
  "build>=1.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
