name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  checks: read
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

jobs:
  verify_ci:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI workflow succeeded on tagged commit
        uses: rohzb/ci-actions/wait-for-workflows@fa15ae6132d071b36c875d64979fa70019b0e49f
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workflows: '["CI"]'
          ref: ${{ github.sha }}
          mode: all_success
          timeout-seconds: "1200"
          poll-interval-seconds: "15"
          require-found: "true"
          fail-fast: "false"

  build-python:
    runs-on: ubuntu-latest
    needs: [verify_ci]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Validate tag and project version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z, got: ${TAG}" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          PROJECT_VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["version"])
          PY
          )"
          if [[ "${PROJECT_VERSION}" != "${VERSION}" ]]; then
            echo "Tag version (${VERSION}) does not match pyproject.toml (${PROJECT_VERSION})." >&2
            exit 1
          fi
          if ! grep -qE "^## \\[${VERSION}\\] " CHANGELOG.md; then
            echo "CHANGELOG.md is missing a section for [${VERSION}]." >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-dist
          path: dist/*

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [build-python]
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          password: ${{ env.PYPI_API_TOKEN }}

  publish-base-image:
    runs-on: ubuntu-latest
    needs: [build-python]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Extract release version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: base_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository_owner }}/acmed-plugin-base-image
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha

      - name: Build and push base image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/base-image/Dockerfile
          push: true
          tags: ${{ steps.base_meta.outputs.tags }}
          labels: ${{ steps.base_meta.outputs.labels }}
          build-args: |
            ACMED_PLUGIN_SDK_SPEC=acmed-plugin-sdk==${{ steps.version.outputs.value }}
            ACMED_PLUGIN_SDK_FALLBACK=https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz

  github-release:
    runs-on: ubuntu-latest
    needs: [build-python, publish-base-image]
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-dist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: |
            dist/*
