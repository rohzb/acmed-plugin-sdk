name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  checks: read
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify_ci:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI workflow succeeded on tagged commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.sha;
            const expectedName = "CI";
            const timeoutMs = 20 * 60 * 1000;
            const pollIntervalMs = 15 * 1000;
            const deadline = Date.now() + timeoutMs;

            while (Date.now() < deadline) {
              const res = await github.rest.checks.listForRef({
                owner,
                repo,
                ref,
                per_page: 100,
              });

              const candidates = res.data.check_runs.filter((run) => run.name === expectedName);
              if (candidates.length === 0) {
                core.info(
                  `No '${expectedName}' check run found yet for commit ${ref}. Retrying in ${pollIntervalMs / 1000}s...`
                );
                await new Promise((resolve) => setTimeout(resolve, pollIntervalMs));
                continue;
              }

              const successful = candidates.some(
                (run) => run.status === "completed" && run.conclusion === "success"
              );
              if (successful) {
                core.info(`'${expectedName}' succeeded for commit ${ref}.`);
                return;
              }

              const anyCompleted = candidates.some((run) => run.status === "completed");
              if (anyCompleted) {
                const states = candidates
                  .map((run) => `${run.id}:${run.status}/${run.conclusion}`)
                  .join(", ");
                core.setFailed(
                  `'${expectedName}' completed without success for commit ${ref}. Found: ${states}`
                );
                return;
              }

              const states = candidates
                .map((run) => `${run.id}:${run.status}/${run.conclusion}`)
                .join(", ");
              core.info(
                `'${expectedName}' still running for commit ${ref}. Current: ${states}. Retrying in ${pollIntervalMs / 1000}s...`
              );
              await new Promise((resolve) => setTimeout(resolve, pollIntervalMs));
            }

            core.setFailed(
              `Timed out waiting for '${expectedName}' to succeed for commit ${ref} after ${timeoutMs / 60000} minutes.`
            );

  build-python:
    runs-on: ubuntu-latest
    needs: [verify_ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate tag and project version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z, got: ${TAG}" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          PROJECT_VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["version"])
          PY
          )"
          if [[ "${PROJECT_VERSION}" != "${VERSION}" ]]; then
            echo "Tag version (${VERSION}) does not match pyproject.toml (${PROJECT_VERSION})." >&2
            exit 1
          fi
          if ! grep -qE "^## \\[${VERSION}\\] " CHANGELOG.md; then
            echo "CHANGELOG.md is missing a section for [${VERSION}]." >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [build-python]
    if: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    runs-on: ubuntu-latest
    needs: [build-python]
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
