name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  checks: read
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify_ci:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI workflow succeeded on tagged commit
        uses: rohzb/ci-actions/wait-for-workflows@fa15ae6132d071b36c875d64979fa70019b0e49f
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workflows: '["CI"]'
          ref: ${{ github.sha }}
          mode: all_success
          timeout-seconds: "1200"
          poll-interval-seconds: "15"
          require-found: "true"
          fail-fast: "false"

  build-python:
    runs-on: ubuntu-latest
    needs: [verify_ci]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Validate tag and project version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z, got: ${TAG}" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          PROJECT_VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["version"])
          PY
          )"
          if [[ "${PROJECT_VERSION}" != "${VERSION}" ]]; then
            echo "Tag version (${VERSION}) does not match pyproject.toml (${PROJECT_VERSION})." >&2
            exit 1
          fi
          if ! grep -qE "^## \\[${VERSION}\\] " CHANGELOG.md; then
            echo "CHANGELOG.md is missing a section for [${VERSION}]." >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-dist
          path: dist/*

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [build-python]
    if: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    runs-on: ubuntu-latest
    needs: [build-python]
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-dist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
