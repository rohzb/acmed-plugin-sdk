[project]
name = "acmed-issuer-example"
version = "0.1.0"
description = "Minimal remote issuer plugin example for acmed gen2"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "acmed-plugin-sdk>=0.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
